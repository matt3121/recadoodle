[project]
name = "recadoodle"
version = "0.1.0"
description = "Experimental API-only Flask backend for preserved 2023 Rec Room clients"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "flask-sock>=0.7,<1",
  "Flask-SQLAlchemy>=3.1,<4",
  "cryptography>=45,<47",
  "PyJWT>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "waitress>=3.0,<4",
  "gunicorn>=23,<24; platform_system != 'Windows'",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["rrserver*"]
exclude = ["instance*", "tests*"]

[tool.setuptools.package-data]
rrserver = ["data/*", "static/room-thumbnails/*"]
