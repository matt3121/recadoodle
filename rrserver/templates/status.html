<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecadoodleAPI</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0f1117; color: #f5f7fa; }
    header { padding: 14px 22px; border-bottom: 1px solid #2a2f3a; font-weight: 700; }
    .label { color: #ff8a3d; letter-spacing: .04em; }
    main { max-width: 680px; margin: 64px auto; padding: 0 22px; }
    .card { padding: 24px; border: 1px solid #2a2f3a; border-radius: 14px; background: #171a22; }
    .online { color: #65d88a; font-weight: 700; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; margin-bottom: 0; }
    dt { color: #aab1bf; }
  </style>
</head>
<body>
  <header><span class="label">RecadoodleAPI</span></header>
  <main>
    <section class="card">
      <h1>API status</h1>
      <p class="online">Online</p>
      <dl>
        <dt>Server</dt><dd>{{ server_version }}</dd>
        <dt>Game build</dt><dd>{{ game_version }}</dd>
      </dl>
    </section>
  </main>
</body>
</html>
